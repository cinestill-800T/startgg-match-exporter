name: Build macOS Release App

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build and upload app zip
    runs-on: macos-latest
    env:
      APP_NAME: StartGGMatchExporter
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      CODE_SIGN_IDENTITY: ${{ vars.MACOS_CODE_SIGN_IDENTITY }}
      CODE_SIGN_CERTIFICATE_NAME: StartGGMatchExporter Local Signing
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Import release signing identity
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          : "${MACOS_CERTIFICATE_P12:?MACOS_CERTIFICATE_P12 is not configured}"
          : "${MACOS_CERTIFICATE_PASSWORD:?MACOS_CERTIFICATE_PASSWORD is not configured}"
          : "${CODE_SIGN_IDENTITY:?MACOS_CODE_SIGN_IDENTITY is not configured}"
          : "${CODE_SIGN_CERTIFICATE_NAME:?CODE_SIGN_CERTIFICATE_NAME is not configured}"

          certificate_path="$RUNNER_TEMP/startgg-signing-identity.p12"
          public_certificate_path="$RUNNER_TEMP/startgg-signing-certificate.pem"
          keychain_path="$RUNNER_TEMP/startgg-signing.keychain-db"
          keychain_password="$(uuidgen)"

          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s \
            "$keychain_path" \
            /Library/Keychains/System.keychain
          security default-keychain -d user -s "$keychain_path"
          security find-certificate \
            -c "$CODE_SIGN_CERTIFICATE_NAME" \
            -p \
            "$keychain_path" > "$public_certificate_path"
          sudo -n security add-trusted-cert \
            -d \
            -p codeSign \
            -r trustRoot \
            -k /Library/Keychains/System.keychain \
            "$public_certificate_path"
          security find-identity -v -p codesigning | grep -Fq "$CODE_SIGN_IDENTITY"

          smoke_path="$RUNNER_TEMP/startgg-codesign-smoke"
          cp /usr/bin/true "$smoke_path"
          codesign \
            --force \
            --options runtime \
            --timestamp=none \
            --sign "$CODE_SIGN_IDENTITY" \
            "$smoke_path"
          codesign --verify --strict "$smoke_path"
          rm -f "$smoke_path"

      - name: Build release app bundle
        run: Scripts/build_app.sh release

      - name: Upload app zip to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="release/${APP_NAME}-macOS-release.zip"
          test -f "$asset"
          gh release upload "$RELEASE_TAG" "$asset" --clobber

      - name: Remove temporary signing keychain
        if: always()
        timeout-minutes: 2
        run: |
          rm -f \
            "$RUNNER_TEMP/startgg-signing-identity.p12" \
            "$RUNNER_TEMP/startgg-signing-certificate.pem" || true
          keychain_path="$RUNNER_TEMP/startgg-signing.keychain-db"
          if [[ -f "$keychain_path" ]]; then
            security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
          fi
